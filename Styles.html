<style>
:root{--primary:#ef4444;--sidebar:#1e293b;--sidebar-hover:#334155;--bg:#f8fafc;
--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--card:#ffffff;--success:#22c55e;
--warning:#f59e0b;--info:#3b82f6;--danger:#ef4444;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px}
.hidden{display:none!important}

/* LOGIN */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%)}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:400px;
box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center;animation:fadeUp .4s ease}
.login-logo{width:72px;height:72px;margin:0 auto 16px;border-radius:50%;
background:var(--primary);display:flex;align-items:center;justify-content:center;
color:#fff;font-size:30px}
.login-card h1{font-size:26px;margin-bottom:4px}
.login-sub{color:var(--muted);margin-bottom:24px;font-size:13px}
.input-group{position:relative;margin-bottom:14px}
.input-group i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.input-group input{width:100%;padding:12px 12px 12px 42px;border:1.5px solid var(--border);
border-radius:10px;font-size:14px;outline:none;transition:.2s}
.input-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(239,68,68,.12)}
.remember{display:block;text-align:left;font-size:13px;color:var(--muted);margin-bottom:16px;cursor:pointer}
.login-hint{margin-top:16px;font-size:12px;color:var(--muted)}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--sidebar);color:#cbd5e1;flex-shrink:0;
display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:.25s}
.sidebar-brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 20px;
font-weight:700;font-size:17px;color:#fff;border-bottom:1px solid #334155}
.sidebar-brand i{color:var(--primary)}
.sidebar-nav{overflow-y:auto;padding:10px 0;flex:1}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#64748b;
padding:14px 20px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;
font-size:13.5px;color:#cbd5e1;border-left:3px solid transparent;transition:.15s}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:rgba(239,68,68,.12);border-left-color:var(--primary);color:#fff}
.main{flex:1;margin-left:250px;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;
align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:40}
.topbar h2{font-size:17px;flex:1}
.topbar-right{display:flex;align-items:center;gap:10px}
.icon-btn{width:36px;height:36px;border:none;border-radius:8px;background:var(--bg);
cursor:pointer;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--primary);color:#fff}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 12px;
border-radius:20px;font-size:12.5px}
.user-chip .avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);
color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.user-chip small{color:var(--muted)}
.hamburger{display:none}
.content{padding:22px;flex:1}
.sidebar-overlay{display:none}

/* CARDS / STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
display:flex;align-items:center;gap:14px;border-left:4px solid var(--primary)}
.stat-card .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;
justify-content:center;font-size:17px;color:#fff;background:var(--primary)}
.stat-card h3{font-size:20px}
.stat-card p{font-size:11.5px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
padding:18px;margin-bottom:20px}
.card h3.card-title{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 12px;background:var(--bg);color:var(--muted);
font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;
border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid var(--border)}
tbody tr:hover{background:#fef2f2}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}
.badge.yellow{background:#fef3c7;color:#92400e}.badge.blue{background:#dbeafe;color:#1e40af}
.badge.gray{background:#f1f5f9;color:#475569}

/* BUTTONS */
.btn{padding:9px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;
cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#dc2626}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{background:#cbd5e1}
.btn-danger{background:var(--danger);color:#fff}.btn-success{background:var(--success);color:#fff}
.btn-block{width:100%;justify-content:center}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px}
.action-btn{width:28px;height:28px;border:none;border-radius:6px;cursor:pointer;margin-right:4px;
color:#fff;font-size:11px}.action-btn.view{background:var(--info)}.action-btn.edit{background:var(--warning)}
.action-btn.del{background:var(--danger)}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:0}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--muted)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;
border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-full{grid-column:1/-1}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;
display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal{background:#fff;border-radius:14px;width:90%;max-width:640px;max-height:88vh;
display:flex;flex-direction:column;animation:fadeUp .2s}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted)}
.modal-header{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;
justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px}
.modal-body{padding:22px;overflow-y:auto}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;
justify-content:flex-end;gap:10px}

/* TOASTS / LOADING */
.toasts{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;color:#fff;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);
display:flex;align-items:center;gap:10px;animation:fadeUp .25s;min-width:240px}
.toast.success{background:var(--success)}.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}.toast.info{background:var(--info)}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:300;
display:flex;align-items:center;justify-content:center}
.spinner{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);
border-radius:50%;animation:spin .8s linear infinite}
.empty-state{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-state i{font-size:38px;margin-bottom:12px;opacity:.4}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
.filters .form-group{min-width:150px;margin-bottom:0}
.pagination{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;align-items:center;font-size:12.5px}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.quick-btn{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 10px;
cursor:pointer;text-align:center;font-size:12px;font-weight:600;color:var(--text);transition:.15s}
.quick-btn i{display:block;font-size:18px;color:var(--primary);margin-bottom:6px}
.quick-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}

/* RESPONSIVE */
@media(max-width:900px){
  .grid-2,.form-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .main{margin-left:0}
  .hamburger{display:block}
  .content{padding:14px}
  .modal{width:95%}
  .user-chip span{display:none}
}

/* PRINT */
@media print{
  .sidebar,.topbar,.toasts,.loading-overlay,.btn,.icon-btn,.modal-footer,
  .filters,.quick-actions{display:none!important}
  .main{margin-left:0}
  .content{padding:0}
  table{font-size:11px}
}
</style>
